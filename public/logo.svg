<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Outer Cube / Silicon Layer -->
  <polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="none" stroke="url(#grad1)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Internal Connections / Neural & Circuit -->
  <line x1="100" y1="25" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="165" y1="62" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="165" y1="138" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="100" y1="175" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="35" y1="138" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  <line x1="35" y1="62" x2="100" y2="100" stroke="url(#grad1)" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Core Node -->
  <circle cx="100" cy="100" r="16" fill="url(#grad2)"/>
  <circle cx="100" cy="100" r="8" fill="#ffffff"/>
  
  <!-- Satellite Nodes -->
  <circle cx="100" cy="25" r="5" fill="#38bdf8"/>
  <circle cx="165" cy="62" r="5" fill="#818cf8"/>
  <circle cx="165" cy="138" r="5" fill="#c084fc"/>
  <circle cx="100" cy="175" r="5" fill="#c084fc"/>
  <circle cx="35" cy="138" r="5" fill="#818cf8"/>
  <circle cx="35" cy="62" r="5" fill="#38bdf8"/>
</svg>
